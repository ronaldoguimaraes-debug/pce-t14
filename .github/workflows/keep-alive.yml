name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 8 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase pcedash
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Pingando Supabase pcedash..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://amibetbgzwaayhyxnank.supabase.co/rest/v1/manualpce_sections?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "206" ]; then
            echo "Supabase ativo e respondendo!"
          else
            echo "Resposta inesperada: $STATUS"
            exit 1
          fi
